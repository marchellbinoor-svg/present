<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selamat Ulang Tahun ke-50, Mami Endri!</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--plum:#3b1f4a;--rose:#e0457b;--gold:#ffc93c;--mint:#1fa89a;--bg:#f7effb;--ph:24svh;--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#fff 0,var(--bg) 65%) fixed;color:var(--plum);line-height:1.5;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Bagel Fat One',system-ui,sans-serif;font-weight:400;line-height:1.1;margin:0}
p{margin:0 0 10px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;cursor:pointer;color:#fff;background:var(--rose);padding:12px 22px;display:inline-flex;align-items:center;gap:8px;transition:transform .15s var(--spring)}
button:active{transform:scale(.92)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#cv{position:fixed;inset:0;pointer-events:none;z-index:20}
.app{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:14px 14px 28px;gap:8px;text-align:center;max-width:560px;margin:auto}
.photo{height:var(--ph);aspect-ratio:3/4;object-fit:cover;object-position:50% 20%;border-radius:999px 999px 22px 22px;border:5px solid var(--gold);box-shadow:0 0 0 4px var(--rose),0 12px 26px rgba(59,31,74,.25);transition:height .8s var(--spring)}
.name{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
h1{font-size:clamp(1.9rem,8vw,3rem);color:var(--rose)}
.age{background:var(--gold);border-radius:999px;padding:2px 14px;font-family:'Bagel Fat One',system-ui,sans-serif;font-size:1.25rem;transform:rotate(-4deg)}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:9px;background:#d9c6e6;transition:all .5s var(--spring)}
.dots i.done{background:var(--mint)}.dots i.on{width:26px;background:var(--rose)}
.stage{width:100%;animation:in .6s var(--spring)}
@keyframes in{from{opacity:0;transform:translateY(30px) scale(.94)}}
.snd{position:fixed;top:12px;right:12px;width:44px;height:44px;padding:0;justify-content:center;background:var(--plum);z-index:15}
.snd svg{width:26px;height:26px}
.ic{width:30px;height:30px;flex:none}.ic svg{width:100%;height:100%;display:block}
.next{margin-top:14px;font-size:1.05rem;background:var(--plum);animation:in .6s var(--spring)}
.hint{font-size:.9rem;opacity:.75}
.wishmsg{font-family:'Bagel Fat One',system-ui,sans-serif;font-size:1.7rem;line-height:1.2;color:var(--rose);animation:in .6s var(--spring)}
.msg{font-weight:700;color:var(--mint);min-height:1.5em;margin-top:8px}
/* game */
.arena{position:relative;height:min(38svh,340px);margin-top:6px;border-radius:26px;overflow:hidden;background:linear-gradient(#ffe8f1,#efe3fb);border:3px dashed #e6c3d6;touch-action:manipulation}
.it{position:absolute;left:0;top:0;padding:0;background:none;will-change:transform;border-radius:50%}
.it svg{width:100%;height:100%;display:block;transition:transform .3s var(--spring),opacity .3s}
.it.caught svg{transform:scale(1.9);opacity:0}
.meter{display:flex;gap:3px;justify-content:center;margin-top:8px}
.meter svg{width:22px;height:22px;filter:grayscale(1);opacity:.35;transition:all .4s var(--spring)}
.meter svg.f{filter:none;opacity:1;transform:scale(1.3)}
/* lilin */
.cake{max-width:290px;width:100%;height:auto}
.flame{cursor:pointer;transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
.flame.off{display:none}
@keyframes flick{to{transform:scale(1.15,.9) rotate(4deg)}}
/* balon */
.balloons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0 34px}
.bal{width:70px;height:84px;padding:0;background:none;animation:bob 2.6s ease-in-out infinite}
.bal svg{width:100%;height:100%}
@keyframes bob{50%{transform:translateY(-12px) rotate(3deg)}}
.pop-out{animation:none!important;transform:scale(1.8)!important;opacity:0;transition:transform .35s var(--spring),opacity .35s}
.wish{min-height:4em;font-weight:700;font-size:1.15rem;color:var(--rose)}
/* hadiah & surat */
.gift,.env{background:none;padding:0;width:min(58%,200px);animation:wig 1.8s ease-in-out infinite}
.gift svg,.env svg{width:100%;height:auto;display:block;overflow:visible}
@keyframes wig{0%,60%,100%{transform:none}10%{transform:rotate(-7deg)}25%{transform:rotate(7deg)}40%{transform:rotate(-4deg)}}
.gift .lid{transition:transform .7s var(--spring)}
.gift.open{animation:none}.gift.open .lid{transform:translateY(-14px) rotate(-16deg)}
.frame{border:10px solid var(--gold);border-radius:20px;padding:12px;background:linear-gradient(#fff,#ffe8f1);box-shadow:inset 0 0 0 3px var(--rose);animation:in .6s var(--spring)}
.frame svg,.frame img{width:100%;max-height:250px;object-fit:contain}
.frame h3{font-size:2rem;color:var(--rose);margin-top:6px}
.letter{background:#fff;border-radius:20px;padding:22px 18px;text-align:left;white-space:pre-line;font-size:1.05rem;box-shadow:0 10px 30px rgba(59,31,74,.15);animation:in .6s var(--spring)}
@media (prefers-reduced-motion:reduce){.stage,.next,.gift,.env,.bal,.flame,.frame,.letter{animation:none!important}}
</style>
</head>

<script>
/* ====== UBAH BAGIAN INI SAJA ====== */
const C = {
  judul: "Happy Birthday to You",
  nama: "Mami Endri",
  umur: 50,
  wishes: [
    "Semoga Mami selalu sehat dan kuat setiap hari 💪",

    "Semoga rezeki Mami dilimpahkan tanpa henti 💰",
    "Semoga senyum Mami tidak pernah luntur 😊",
    "Semoga semua kebaikan Mami dibalas berlipat ganda ❤️"
  ],
  surat: "Mami tersayang,\n\nMakasih udah banyak bantu Mamah Yeni ya. Semoga yang di atas membalasnya berlipat ganda, dan semoga Mami berumur panjang serta dilimpahkan rezekinya.\n\nWISH YOU ALL THE BEST ❤️\n\nMay this year be filled with happiness, health, and good things."
};
/* Hadiah: taruh foto boneka bernama boneka.jpg di folder yang sama (opsional) */
/* ================================== */

const $ = id => document.getElementById(id);
$('nama').textContent = C.judul; $('umur').textContent = "ke-" + C.umur;

/* ikon buatan sendiri */
const ICON = {
  heart: c => `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 43C7 31 3 21 3 15A10.5 10.5 0 0 1 24 12a10.5 10.5 0 0 1 21 3c0 6-4 16-21 28z" fill="${c}"/><ellipse cx="14" cy="14" rx="4" ry="2.6" transform="rotate(-35 14 14)" fill="#fff" opacity=".55"/></svg>`,
  star: c => `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3l6.4 13.2 14.4 1.9-10.6 10 2.7 14.3L24 35.4 11.1 42.4l2.7-14.3L3.2 18.1l14.4-1.9z" fill="${c}"/><circle cx="19" cy="17" r="2.2" fill="#fff" opacity=".6"/></svg>`,
  cake: () => `<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="29" width="36" height="14" rx="4" fill="#9b6df0"/><rect x="10" y="20" width="28" height="12" rx="4" fill="#ff5c93"/><path d="M10 26q4 4 7 0t7 0 7 0 7 0v-4H10z" fill="#fff"/><rect x="22" y="10" width="4" height="10" rx="1.5" fill="#ffc93c"/><path d="M24 2c3 3 3 5 0 7-3-2-3-4 0-7z" fill="#ff8a1f"/></svg>`,
  balloon: c => `<svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="18" rx="13" ry="15" fill="${c}"/><path d="M24 33l-3.5 4.5h7z" fill="${c}"/><path d="M24 37q-5 4 0 9" stroke="#9a8aa5" stroke-width="2" fill="none"/><ellipse cx="18" cy="12" rx="3.2" ry="5.5" transform="rotate(20 18 12)" fill="#fff" opacity=".4"/></svg>`,
  gift: () => `<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="21" width="36" height="22" rx="3" fill="#ff5c93"/><rect x="4" y="14" width="40" height="9" rx="3" fill="#ff9dbf"/><rect x="21" y="14" width="6" height="29" fill="#ffc93c"/><path d="M24 14C15 3 7 9 15 14zM24 14C33 3 41 9 33 14z" fill="#ffc93c"/></svg>`,
  mail: () => `<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="10" width="40" height="28" rx="4" fill="#1fa89a"/><path d="M4 14l20 14 20-14" stroke="#fff" stroke-width="3" fill="none"/><path d="M24 36c-6-4-8-7-8-9a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 2-2 5-8 9z" fill="#ffc93c" transform="translate(0 -2)"/></svg>`,
  sound: m => `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 18h8l10-8v28l-10-8H6z" fill="#fff"/>${m ? '<path d="M31 18l12 12M43 18L31 30" stroke="#ffc93c" stroke-width="3.5" stroke-linecap="round"/>' : '<path d="M30 17q5 7 0 14M35 12q9 12 0 24" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>'}</svg>`
};
const ic = s => `<span class="ic">${s}</span>`;

/* confetti */
const cv = $('cv'), cx = cv.getContext('2d'); let P = [], run = false;
const calm = matchMedia('(prefers-reduced-motion:reduce)').matches;
function rs(){ cv.width = innerWidth; cv.height = innerHeight } rs(); addEventListener('resize', rs);
function burst(x, y, n = 90){
  if (calm) n = Math.min(n, 15);
  const col = ['#e0457b','#ffc93c','#1fa89a','#7b4bd6','#ffffff'];
  for (let i = 0; i < n; i++){
    const a = Math.random()*6.28, s = 3 + Math.random()*7;
    P.push({x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 4, r: 3 + Math.random()*4, c: col[i%5], l: 90 + Math.random()*60, t: Math.random()*6});
  }
  if (!run) loop();
}
function loop(){
  run = true; cx.clearRect(0, 0, cv.width, cv.height);
  P = P.filter(p => p.l > 0);
  for (const p of P){
    p.vy += .2; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.l--; p.t += .2;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.t); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r/2, p.r*2, p.r); cx.restore();
  }
  if (P.length) requestAnimationFrame(loop); else { run = false; cx.clearRect(0, 0, cv.width, cv.height) }
}
const rain = () => { for (let i = 0; i < 6; i++) setTimeout(() => burst(Math.random()*innerWidth, innerHeight*.25, 60), i*320) };

/* lagu berulang tanpa henti */
let ac = null, master = null, muted = false, next = 0;
const N = [[262,.75],[262,.25],[294,1],[262,1],[349,1],[330,2],[262,.75],[262,.25],[294,1],[262,1],[392,1],[349,2],
[262,.75],[262,.25],[523,1],[440,1],[349,1],[330,1],[294,1],[466,.75],[466,.25],[440,1],[349,1],[392,1],[349,2]];
function sched(){
  let t = next;
  for (const [f, d] of N){
    const o = ac.createOscillator(), g = ac.createGain(), len = d*.46;
    o.type = 'triangle'; o.frequency.value = f; o.connect(g); g.connect(master);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.25, t + .03); g.gain.exponentialRampToValueAtTime(.001, t + len);
    o.start(t); o.stop(t + len + .05); t += len;
  }
  next = t + .9;
  setTimeout(sched, Math.max(200, (next - ac.currentTime - 1.5)*1000));
}
function startMusic(){
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = muted ? 0 : .5; master.connect(ac.destination);
  next = ac.currentTime + .1; sched();
}
function setSound(){ $('snd').innerHTML = ICON.sound(muted) }
$('snd').onclick = () => { startMusic(); muted = !muted; master.gain.value = muted ? 0 : .5; setSound() };
setSound();
addEventListener('pointerdown', startMusic, {once: true});
document.addEventListener('visibilitychange', () => { if (ac && !document.hidden) ac.resume() });

/* alur berurutan */
const host = $('host'), dots = $('dots');
dots.innerHTML = '<i></i><i></i><i></i><i></i><i></i>';
let won = false;
function go(i){
  [...dots.children].forEach((d, k) => d.className = k < i ? 'done' : k === i ? 'on' : '');
  document.documentElement.style.setProperty('--ph', i === 0 ? '24svh' : '14svh');
  const s = document.createElement('div'); s.className = 'stage';
  host.replaceChildren(s); scrollTo(0, 0);
  [game, lilin, balon, hadiah, surat][i](s);
}
function showNext(s, label, icon, i){
  const b = document.createElement('button'); b.className = 'next'; b.innerHTML = ic(icon) + label;
  b.onclick = () => go(i); s.appendChild(b);
}

/* 1. game: tangkap hati yang melayang */
function game(s){
  const need = 10;
  s.innerHTML = `<p><b>Tangkap ${need} hati</b> yang melayang. Sentuh sebelum kabur!</p><div class="arena" id="ar"></div><div class="meter" id="mtr"></div><p class="msg" id="gm" aria-live="polite"></p>`;
  const ar = $('ar'); let got = 0, items = [], alive = true, last = performance.now(), sp = 0;
  $('mtr').innerHTML = ICON.heart('#e0457b').repeat(need);
  const cols = ['#e0457b','#ff7aa8','#9b6df0','#1fa89a'];
  function spawn(){
    const w = ar.clientWidth, size = 54 + Math.random()*26, el = document.createElement('button');
    el.className = 'it'; el.style.width = el.style.height = size + 'px'; el.setAttribute('aria-label', 'Tangkap');
    el.innerHTML = Math.random() < .2 ? ICON.star('#ffc93c') : ICON.heart(cols[Math.random()*4|0]);
    ar.appendChild(el);
    const o = {el, size, x: Math.random()*(w - size), y: ar.clientHeight + 10, sp: 55 + Math.random()*55, ph: Math.random()*6, amp: 10 + Math.random()*18};
    el.onpointerdown = e => {
      e.preventDefault(); if (o.dead) return; o.dead = true; el.classList.add('caught'); setTimeout(() => el.remove(), 320);
      const r = el.getBoundingClientRect(); burst(r.left + size/2, r.top + size/2, 20);
      $('mtr').children[got].classList.add('f'); got++;
      if (got >= need) win();
    };
    items.push(o);
  }
  function tick(now){
    if (!alive) return;
    const dt = Math.min(.05, (now - last)/1000); last = now; sp -= dt;
    if (sp <= 0 && items.length < 6 && got < need){ spawn(); sp = .45 + Math.random()*.5 }
    for (const o of items){
      if (o.dead) continue;
      o.y -= o.sp*dt; o.ph += dt*2.2;
      const x = Math.max(0, Math.min(ar.clientWidth - o.size, o.x + Math.sin(o.ph)*o.amp));
      o.el.style.transform = `translate(${x}px,${o.y}px) rotate(${Math.sin(o.ph)*10}deg)`;
      if (o.y < -o.size - 10){ o.dead = true; o.el.remove() }
    }
    items = items.filter(o => !o.dead);
    requestAnimationFrame(tick);
  }
  function win(){
    alive = false;
    items.forEach(o => { o.dead = true; o.el.classList.add('caught'); setTimeout(() => o.el.remove(), 320) });
    $('gm').textContent = 'Hore, semua hati terkumpul!'; burst(innerWidth/2, innerHeight/2, 150);
    showNext(s, 'Next page', ICON.cake(), 1);
  }
  requestAnimationFrame(tick);
}

  </svg>

    showNext(s, 'Next page', ICON.balloon('#ff7aa8'), 2);
  };
  fl.forEach(f => { const off = () => { f.classList.add('off'); check() }; f.onclick = off; f.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') off() } });
}

/* 3. balon doa */
function balon(s){
  s.innerHTML = `<p>Pecahkan semua balon untuk membaca doanya (<b id="cn">0</b>/${C.wishes.length}).</p><div class="balloons" id="bl"></div><div class="wish" id="wish" aria-live="polite"></div>`;
  const cols = ['#e0457b','#ffc93c','#1fa89a','#9b6df0','#ff8a1f']; let n = 0;
  C.wishes.forEach((w, i) => {
    const b = document.createElement('button'); b.className = 'bal'; b.style.animationDelay = (i*.35) + 's';
    b.innerHTML = ICON.balloon(cols[i % 5]); b.setAttribute('aria-label', 'Balon doa ' + (i+1));
    b.onclick = () => {
      const r = b.getBoundingClientRect(); b.classList.add('pop-out'); b.disabled = true; burst(r.left + 35, r.top + 35, 40);
      $('wish').textContent = w; $('cn').textContent = ++n;
      if (n === C.wishes.length) showNext(s, 'Next page', ICON.gift(), 3);
    };
    $('bl').appendChild(b);
  });
}

/* 5. surat */
function surat(s){
  s.innerHTML = `<p>Yang terakhir: ada surat untuk Mami. Sentuh amplopnya!</p><button class="env" id="ev" aria-label="Buka surat">${ICON.mail()}</button>`;
  $('ev').onclick = () => {

    setTimeout(() => {
      s.innerHTML = `<div class="letter" id="ls"></div>`; $('ls').textContent = C.surat; rain();
      const b = document.createElement('button'); b.className = 'next'; b.innerHTML = ic(ICON.heart('#ff7aa8')) + 'Thank you'; b.onclick = keluar; s.appendChild(b);

}

function keluar(){
  window.close();
  setTimeout(() => location.replace('about:blank'), 250);
}

go(0);
